[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
	"crates/host",
	"crates/pane-api",
	"crates/pane-clock",
	"crates/pane-inspector",
	"crates/pane-notes",
	"crates/pane-view2d",
	"crates/pane-view3d",
	"crates/shell-tauri",
]
# shell-tauri needs webkitgtk; build it on purpose with -p shell-tauri.
default-members = [
	"crates/host",
	"crates/pane-api",
	"crates/pane-clock",
	"crates/pane-inspector",
	"crates/pane-notes",
	"crates/pane-view2d",
	"crates/pane-view3d",
]

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
