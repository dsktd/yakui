[package]
name = "host"
version.workspace = true
edition.workspace = true

[dependencies]
pane-api = { path = "../pane-api" }
pane-clock = { path = "../pane-clock" }
pane-inspector = { path = "../pane-inspector" }
pane-notes = { path = "../pane-notes" }
pane-outliner = { path = "../pane-outliner" }
pane-palette = { path = "../pane-palette" }
pane-view2d = { path = "../pane-view2d" }
pane-view3d = { path = "../pane-view3d" }
pane-widgets = { path = "../pane-widgets" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["ws"] } # https://github.com/tokio-rs/axum
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
futures-util = "0.3"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# The IrohBus: another host's panes on this bus, over iroh (DESIGN.md).
data-encoding = { version = "2", optional = true }
iroh = { version = "1.4", optional = true }
iroh-gossip = { version = "0.101", optional = true }

[features]
iroh = ["dep:iroh", "dep:iroh-gossip", "dep:data-encoding"]

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
