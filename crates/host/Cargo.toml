[package]
name = "host"
version.workspace = true
edition.workspace = true

[dependencies]
pane-api = { path = "../pane-api" }
pane-clock = { path = "../pane-clock" }
pane-notes = { path = "../pane-notes" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["ws"] } # https://github.com/tokio-rs/axum
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
futures-util = "0.3"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
